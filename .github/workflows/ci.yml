name: CI

# Fast pre-release gate: compile-check the Tauri crate on every push to main and
# every PR, BEFORE a release tag is cut. release.yml only runs on `v*` tags, so
# without this a compile break could sit on main until someone tries to release.
#
# Runs on windows + macos because the engine is heavily #[cfg(target_os = ...)]
# gated (WorkerW/underlay on Windows, objc2/NSWindow on macOS) — a check on a
# single OS silently skips the other platform's code.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Blocking: must compile on both platforms. This is the real gate.
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # Blocking. Covers is_safe_theme_name, deep-link token decoding, and the
      # install path (flat vs wrapper-folder zips, entry/size caps, traversal) —
      # the extract+rename logic where a silent failure means a paid wallpaper
      # never shows up in the dropdown.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Advisory: rustfmt would rewrite ~970 lines of existing code, which would
      # bury real changes in reformatting noise. Keep it visible, not blocking,
      # until someone does that reformat as its own commit.
      - name: rustfmt (advisory)
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      # Blocking as of 2026-08-04: the tree is clean at -D warnings across all
      # targets. Keep it that way — this is the cheapest defect gate available.
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # The frontend bundle is only built during a release (tauri.conf.json's
  # beforeBuildCommand), so a syntax error in app.js or a bad import used to
  # reach a tag before anyone noticed. One cheap Linux job closes that.
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install dependencies
        run: npm ci
      - name: build bundle
        run: npm run build
